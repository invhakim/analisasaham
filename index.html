<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mini App Saham</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* Floating Button */
.btn-floating {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--primary-color);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    z-index: 999;
}

/* Panel Default (Hidden) */
.bot-commands-panel {
    position: fixed;
    bottom: 0;
    right: 1rem;
    width: 300px;
    background-color: var(--bg-card);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: var(--shadow-lg);
    z-index: 1000;

    /* animasi */
    transform: translateY(110%);
    opacity: 0;
    transition: transform var(--transition-slow),
                opacity var(--transition-normal);
}

/* Saat Aktif */
.bot-commands-panel.show {
    transform: translateY(0);
    opacity: 1;
}

/* Header */
.commands-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--spacing-sm);
    border-bottom: 1px solid var(--border-color);
}

.btn-close-panel {
    background: transparent;
    color: var(--text-primary);
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
}

    .bot-commands-panel {
    will-change: transform, opacity;
}


  </style>
</head>
<body>

<h1 id="title">Loading...</h1>
<!-- Button Floating -->
<button id="openCommands" class="btn-floating">
    <i class="fas fa-robot"></i>
</button>

<!-- Telegram Bot Commands Panel -->
<div class="bot-commands-panel" id="botPanel">
    <div class="commands-header">
        <h4><i class="fas fa-robot"></i> Telegram Bot Commands</h4>
        <button class="btn-close-panel" id="closePanel">&times;</button>
    </div>
    <div class="commands-list">
        <div class="command-item"><code>/start</code><span>Memulai bot</span></div>
        <div class="command-item"><code>/help</code><span>Bantuan dan panduan</span></div>
        <div class="command-item"><code>/tr-[KODE]</code><span>Trendlines analysis</span></div>
        <div class="command-item"><code>/bsd-[KODE]</code><span>Buyer/Seller diagram</span></div>
        <div class="command-item"><code>/t5-[KODE]</code><span>Top 5 brokers</span></div>
        <div class="command-item"><code>/fl-[KODE]-[DATE]</code><span>Flow analysis</span></div>
        <div class="command-item"><code>/fc-[KODE]-[PERIOD]</code><span>FundaChart analysis</span></div>
        <div class="command-item"><code>/rrg-[KODE]</code><span>RRG matrix analysis</span></div>
    </div>
</div>
<script>
const openBtn = document.getElementById("openCommands");
const closeBtn = document.getElementById("closePanel");
const panel = document.getElementById("botPanel");

openBtn.addEventListener("click", () => {
    panel.classList.add("show");
});

closeBtn.addEventListener("click", () => {
    panel.classList.remove("show");
});

/* Optional: klik di luar panel untuk menutup */
document.addEventListener("click", (e) => {
    if (!panel.contains(e.target) && !openBtn.contains(e.target)) {
        panel.classList.remove("show");
    }
});
</script>


</body>
</html>
