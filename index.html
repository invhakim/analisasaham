<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Holistik Pro Investment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ===== VARIABLES ===== */
    :root {
        /* Primary Colors */
        --primary-color: #2563eb;
        --primary-dark: #1d4ed8;
        --primary-light: #3b82f6;
        
        /* Secondary Colors */
        --secondary-color: #10b981;
        --secondary-dark: #0d9668;
        
        /* Status Colors */
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --danger-color: #ef4444;
        --info-color: #3b82f6;
        
        /* Neutral Colors */
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-card: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border-color: #475569;
        
        /* Spacing */
        --spacing-xs: 0.5rem;
        --spacing-sm: 1rem;
        --spacing-md: 1.5rem;
        --spacing-lg: 2rem;
        --spacing-xl: 3rem;
        
        /* Border Radius */
        --radius-sm: 0.5rem;
        --radius-md: 0.75rem;
        --radius-lg: 1rem;
        
        /* Shadows */
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        
        /* Transitions */
        --transition-fast: 150ms ease;
        --transition-normal: 300ms ease;
    }

    /* ===== RESET & BASE ===== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        padding: var(--spacing-md);
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .header {
        text-align: center;
        margin-bottom: var(--spacing-xl);
        padding: var(--spacing-lg);
        background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        position: relative;
        overflow: hidden;
    }

    .header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(45deg, transparent 50%, rgba(255, 255, 255, 0.1) 50%);
        background-size: 20px 20px;
        opacity: 0.2;
    }

    .header h1 {
        font-size: 2.5rem;
        margin-bottom: var(--spacing-sm);
        color: white;
        position: relative;
        z-index: 1;
    }

    .header p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1.1rem;
        position: relative;
        z-index: 1;
    }

    /* ===== BUTTONS ===== */
    .btn-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: var(--spacing-md);
        margin-bottom: var(--spacing-xl);
    }

    .btn {
        padding: var(--spacing-md) var(--spacing-lg);
        border: none;
        border-radius: var(--radius-md);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition-normal);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
        position: relative;
        overflow: hidden;
        min-height: 70px;
    }

    .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 30%, rgba(255, 255, 255, 0.1) 70%, transparent 70%);
        background-size: 300% 300%;
        opacity: 0;
        transition: opacity var(--transition-normal);
    }

    .btn:hover::before {
        opacity: 1;
        animation: shine 2s infinite;
    }

    @keyframes shine {
        0% { background-position: -100% -100%; }
        100% { background-position: 200% 200%; }
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
        color: white;
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
    }

    .btn-secondary {
        background: linear-gradient(135deg, var(--secondary-color), var(--secondary-dark));
        color: white;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
    }

    .btn-warning {
        background: linear-gradient(135deg, var(--warning-color), #e69b00);
        color: white;
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    .btn-warning:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
    }

    .btn-danger {
        background: linear-gradient(135deg, var(--danger-color), #dc2626);
        color: white;
        box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
    }

    .btn i {
        font-size: 1.2em;
    }

    /* ===== FORM INPUT ===== */
    .input-section {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: var(--spacing-lg);
        margin-bottom: var(--spacing-xl);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-color);
    }

    .input-section h3 {
        color: var(--text-primary);
        margin-bottom: var(--spacing-md);
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
    }

    .input-section h3 i {
        color: var(--primary-color);
    }

    .input-group {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--spacing-md);
        align-items: center;
    }

    @media (max-width: 768px) {
        .input-group {
            grid-template-columns: 1fr;
        }
    }

    .input-field {
        padding: var(--spacing-md);
        background: var(--bg-secondary);
        border: 2px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-size: 1rem;
        transition: all var(--transition-fast);
    }

    .input-field:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .input-field::placeholder {
        color: var(--text-muted);
    }

    /* ===== COMMANDS SECTION ===== */
    .commands-section {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: var(--spacing-lg);
        margin-bottom: var(--spacing-xl);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-color);
    }

    .commands-section h3 {
        color: var(--text-primary);
        margin-bottom: var(--spacing-md);
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
    }

    .commands-section h3 i {
        color: var(--secondary-color);
    }

    .commands-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: var(--spacing-md);
    }

    /* ===== NOTIFICATION ===== */
    .notification {
        position: fixed;
        bottom: var(--spacing-lg);
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--bg-card);
        color: var(--text-primary);
        padding: var(--spacing-md) var(--spacing-lg);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        z-index: 1000;
        opacity: 0;
        transition: all var(--transition-normal);
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        max-width: 400px;
        width: 90%;
        border-left: 4px solid var(--primary-color);
    }

    .notification.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }

    .notification.success {
        border-left-color: var(--success-color);
    }

    .notification.error {
        border-left-color: var(--danger-color);
    }

    .notification.info {
        border-left-color: var(--info-color);
    }

    .notification i {
        font-size: 1.2em;
    }

    /* ===== FOOTER ===== */
    .footer {
        text-align: center;
        padding: var(--spacing-lg);
        color: var(--text-muted);
        font-size: 0.9rem;
        border-top: 1px solid var(--border-color);
        margin-top: var(--spacing-xl);
    }

    /* ===== LOADING STATE ===== */
    .btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
    }

    .loading-dots {
        display: inline-block;
        position: relative;
        width: 20px;
        height: 20px;
    }

    .loading-dots::after {
        content: " ";
        display: block;
        border-radius: 50%;
        width: 0;
        height: 0;
        margin: 8px;
        box-sizing: border-box;
        border: 8px solid currentColor;
        border-color: currentColor transparent currentColor transparent;
        animation: loading-dots 1.2s infinite;
    }

    @keyframes loading-dots {
        0% { transform: rotate(0); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
        50% { transform: rotate(900deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
        100% { transform: rotate(1800deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1><i class="fas fa-chart-network"></i> Holistik Pro</h1>
      <p>Advanced Investment Analysis Tools</p>
    </header>

    <!-- Button Grid -->
    <div class="btn-grid">
      <button class="btn btn-primary" data-cmd="/start">
        <i class="fas fa-play"></i> /start
      </button>
      <button class="btn btn-secondary" data-cmd="/help">
        <i class="fas fa-question-circle"></i> /help
      </button>
      <button class="btn btn-warning" data-cmd="/scr">
        <i class="fas fa-filter"></i> /scr
      </button>
      <button class="btn btn-danger" data-cmd="/tng">
        <i class="fas fa-chart-line"></i> /tng
      </button>
    </div>

    <!-- Form Input Section -->
    <section class="input-section">
      <h3><i class="fas fa-search"></i> Custom Analysis</h3>
      <div class="input-group">
        <input type="text" 
               class="input-field" 
               id="stock-input" 
               placeholder="Enter stock code (BBCA, TLKM, BBRI...)"
               maxlength="10">
        <button class="btn btn-primary" id="analyze-btn">
          <i class="fas fa-chart-line"></i> Analyze
        </button>
      </div>
    </section>

    <!-- Quick Commands Section -->
    <section class="commands-section">
      <h3><i class="fas fa-bolt"></i> Quick Commands</h3>
      <div class="commands-grid">
        <button class="btn btn-secondary" data-cmd="/tr-DGIK">
          <i class="fas fa-chart-line"></i> Trendlines DGIK
        </button>
        <button class="btn btn-secondary" data-cmd="/fc-BUMI">
          <i class="fas fa-chart-pie"></i> FundaChart BUMI
        </button>
        <button class="btn btn-secondary" data-cmd="/bsd-GULA">
          <i class="fas fa-balance-scale"></i> BSD GULA
        </button>
        <button class="btn btn-secondary" data-cmd="/t5-DGIK">
          <i class="fas fa-users"></i> Top 5 Brokers
        </button>
        <button class="btn btn-secondary" data-cmd="/fl-DGIK-2025-12-15">
          <i class="fas fa-water"></i> Flow Analysis
        </button>
        <button class="btn btn-secondary" data-cmd="/rrg-DGIK">
          <i class="fas fa-rocket"></i> RRG Matrix
        </button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p><i class="fas fa-robot"></i> Holistik Pro Investment Bot • Powered by ❤️</p>
      <p>Commands will be sent to your Telegram chat</p>
    </footer>
  </div>

  <!-- Notification -->
  <div class="notification" id="notification">
    <i class="fas fa-check-circle"></i>
    <span id="notification-text">Command sent successfully!</span>
  </div>

  <script>
    // ===== KONFIGURASI =====
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx0lQNDNGm5nIe5iwZx3MlHMmNWFcYbf32bwmrf2sPkz6Pp13i2ZGuU-wkypVT3yqGHkw/exec';

    // ===== INISIALISASI =====
    const tg = window.Telegram.WebApp;

    // ===== NOTIFICATION SYSTEM =====
    let notificationTimeout;

    function showNotification(message, type = 'info', duration = 3000) {
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notification-text');
        const icon = notification.querySelector('i');
        
        // Set message and type
        notificationText.textContent = message;
        notification.className = `notification ${type}`;
        
        // Update icon based on type
        const icons = {
            success: 'fa-check-circle',
            error: 'fa-exclamation-circle',
            warning: 'fa-exclamation-triangle',
            info: 'fa-info-circle'
        };
        icon.className = `fas ${icons[type] || icons.info}`;
        
        // Show notification
        notification.classList.add('show');
        
        // Auto hide
        clearTimeout(notificationTimeout);
        notificationTimeout = setTimeout(() => {
            notification.classList.remove('show');
        }, duration);
    }

    // ===== FUNGSI UTAMA =====
    async function sendTelegramCommand(commandText) {
        const user = tg.initDataUnsafe.user;
        
        if (!user || !user.id) {
            showNotification("Open this app through Telegram to use this feature", "error");
            return;
        }
        
        // Tampilkan loading state
        const buttons = document.querySelectorAll('.btn[data-cmd], #analyze-btn');
        buttons.forEach(btn => {
            btn.disabled = true;
            const originalText = btn.innerHTML;
            btn.dataset.originalText = originalText;
            btn.innerHTML = `<span class="loading-dots"></span>`;
        });
        
        showNotification(`Sending command: ${commandText}...`, "info");
        
        const requestData = {
            userId: user.id,
            command: commandText,
            username: user.username || '',
            firstName: user.first_name || 'User',
            source: 'mini_app'
        };
        
        try {
            // Kirim ke Google Apps Script
            await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            });
            
            // Beri feedback sukses
            showNotification(`✅ Command "${commandText}" sent! Check your Telegram chat.`, "success");
            
            // Getar jika didukung
            try {
                if (tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            } catch (e) {
                console.log('Haptic feedback not available');
            }
            
            // Clear input field
            document.getElementById('stock-input').value = '';
            
        } catch (error) {
            console.error('Error:', error);
            showNotification('❌ Failed to send command. Please try again.', "error");
        } finally {
            // Restore buttons
            setTimeout(() => {
                buttons.forEach(btn => {
                    btn.disabled = false;
                    if (btn.dataset.originalText) {
                        btn.innerHTML = btn.dataset.originalText;
                    }
                });
            }, 500);
        }
    }

    // ===== SETUP EVENT LISTENERS =====
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Web App Version:', tg.version);
        console.log('User:', tg.initDataUnsafe.user);
        
        // Setup Telegram WebApp
        tg.expand();
        
        // Setup command buttons
        document.querySelectorAll('.btn[data-cmd]').forEach(button => {
            button.addEventListener('click', function() {
                const command = this.getAttribute('data-cmd');
                if (command) {
                    sendTelegramCommand(command);
                }
            });
        });
        
        // Setup analyze button
        document.getElementById('analyze-btn').addEventListener('click', function() {
            const stockCode = document.getElementById('stock-input').value.trim().toUpperCase();
            if (!stockCode) {
                showNotification("Please enter a stock code first!", "warning");
                return;
            }
            sendTelegramCommand(`/tr-${stockCode}`);
        });
        
        // Enter key support
        document.getElementById('stock-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('analyze-btn').click();
            }
        });
        
        // Telegram Main Button
        tg.MainButton.setText("Open in Telegram");
        tg.MainButton.onClick(() => {
            tg.close();
        });
        tg.MainButton.show();
        
        // Handle deep linking
        const startParam = tg.initDataUnsafe.start_param;
        if (startParam && startParam.startsWith('cmd_')) {
            const command = startParam.replace('cmd_', '/').replace(/_/g, '-');
            setTimeout(() => sendTelegramCommand(command), 1000);
        }
    });
  </script>
</body>
</html>
