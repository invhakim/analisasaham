<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Chart Saham</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      text-align: center;
    }
    img {
      max-width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }
    .code {
      font-size: 18px;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="code" id="code">Loading...</div>
<img id="chart" />

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const params = new URLSearchParams(window.location.search);
  const code = params.get("code") || "-";
  const chart = params.get("chart");

  document.getElementById("code").innerText = `Kode Saham: ${code}`;

  if (chart) {
    document.getElementById("chart").src = chart;
  } else {
    document.getElementById("chart").alt = "Chart tidak tersedia";
  }
</script>

</body>
</html>
