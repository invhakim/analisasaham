<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Holistik Pro Investment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ===== VARIABLES ===== */
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #10b981;
      --dark: #0f172a;
      --darker: #020617;
      --light: #f8fafc;
      --gray: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(71, 85, 105, 0.3);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
      color: var(--light);
      min-height: 100vh;
      padding: 16px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 80px;
    }
    
    /* ===== HEADER ===== */
    .header {
      text-align: center;
      margin-bottom: 32px;
      padding: 24px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      position: relative;
      overflow: hidden;
    }
    
    .header::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .header p {
      color: var(--gray);
      font-size: 15px;
    }
    
    /* ===== COMMAND SECTION ===== */
    .section {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid var(--card-border);
    }
    
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--light);
      font-size: 18px;
      font-weight: 600;
    }
    
    .section-title i {
      color: var(--primary);
    }
    
    /* ===== COMMAND BUTTONS ===== */
    .command-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .command-btn {
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--light);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    
    .command-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(16, 185, 129, 0.1));
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .command-btn:hover::before {
      opacity: 1;
    }
    
    .command-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    
    .command-btn i {
      font-size: 24px;
      color: var(--primary);
    }
    
    .command-btn .label {
      font-size: 13px;
      color: var(--gray);
      margin-top: 4px;
    }
    
    /* Primary Commands */
    .command-btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
    }
    
    .command-btn.primary i {
      color: white;
    }
    
    .command-btn.primary .label {
      color: rgba(255, 255, 255, 0.9);
    }
    
    /* Secondary Commands */
    .command-btn.secondary {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.2);
    }
    
    .command-btn.secondary i {
      color: var(--secondary);
    }
    
    /* ===== SEARCH SECTION ===== */
    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .search-input {
      flex: 1;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--light);
      font-size: 15px;
      transition: all 0.2s ease;
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
    }
    
    .search-input::placeholder {
      color: var(--gray);
    }
    
    .search-btn {
      padding: 0 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    
    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
    }
    
    /* ===== RESULT SECTION ===== */
    .result-container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
      border: 1px solid var(--card-border);
      display: none;
    }
    
    .result-container.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }
    
    .result-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--light);
    }
    
    .result-title i {
      color: var(--primary);
      margin-right: 10px;
    }
    
    .close-result {
      background: none;
      border: none;
      color: var(--gray);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    
    .close-result:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--light);
    }
    
    .result-content {
      color: var(--light);
      line-height: 1.6;
    }
    
    .analysis-card {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border-left: 4px solid var(--primary);
    }
    
    .analysis-card.success {
      border-left-color: var(--success);
    }
    
    .analysis-card.warning {
      border-left-color: var(--warning);
    }
    
    .analysis-card.danger {
      border-left-color: var(--danger);
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .card-content {
      color: var(--gray);
      font-size: 14px;
    }
    
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    
    .metric {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    
    .metric-label {
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 4px;
    }
    
    .metric-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--light);
    }
    
    .metric-value.positive { color: var(--success); }
    .metric-value.negative { color: var(--danger); }
    
    /* ===== LOADING ===== */
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }
    
    .loading.active {
      display: block;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: var(--gray);
      font-size: 14px;
    }
    
    /* ===== NOTIFICATION ===== */
    .notification {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 24px;
      color: var(--light);
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 400px;
      width: 90%;
    }
    
    .notification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    .notification i {
      font-size: 18px;
    }
    
    .notification.success { border-left: 4px solid var(--success); }
    .notification.error { border-left: 4px solid var(--danger); }
    .notification.info { border-left: 4px solid var(--primary); }
    
    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .container {
        padding: 12px;
      }
      
      .header {
        padding: 20px;
        margin-bottom: 24px;
      }
      
      .header h1 {
        font-size: 24px;
      }
      
      .command-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .search-box {
        flex-direction: column;
      }
      
      .search-btn {
        justify-content: center;
        padding: 16px;
      }
      
      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (max-width: 400px) {
      .command-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1><i class="fas fa-chart-network"></i> Holistik Pro Investment</h1>
      <p>Advanced Stock Analysis Tools</p>
    </header>
    
    <!-- Basic Commands -->
    <section class="section">
      <div class="section-title">
        <i class="fas fa-terminal"></i>
        <span>Basic Commands</span>
      </div>
      
      <div class="command-grid">
        <button class="command-btn primary" data-cmd="/start">
          <i class="fas fa-play"></i>
          <span>/start</span>
          <span class="label">Start Bot</span>
        </button>
        
        <button class="command-btn primary" data-cmd="/help">
          <i class="fas fa-question-circle"></i>
          <span>/help</span>
          <span class="label">Help Guide</span>
        </button>
        
        <button class="command-btn" data-cmd="/scr">
          <i class="fas fa-filter"></i>
          <span>/scr</span>
          <span class="label">Screener</span>
        </button>
        
        <button class="command-btn" data-cmd="/tng">
          <i class="fas fa-chart-line"></i>
          <span>/tng</span>
          <span class="label">Top Nego</span>
        </button>
      </div>
    </section>
    
    <!-- Stock Analysis Commands -->
    <section class="section">
      <div class="section-title">
        <i class="fas fa-chart-line"></i>
        <span>Stock Analysis</span>
      </div>
      
      <div class="command-grid">
        <button class="command-btn secondary" data-cmd="/tr-DGIK">
          <i class="fas fa-chart-line"></i>
          <span>Trendlines</span>
          <span class="label">DGIK</span>
        </button>
        
        <button class="command-btn secondary" data-cmd="/fc-BUMI">
          <i class="fas fa-chart-pie"></i>
          <span>FundaChart</span>
          <span class="label">BUMI</span>
        </button>
        
        <button class="command-btn secondary" data-cmd="/bsd-GULA">
          <i class="fas fa-balance-scale"></i>
          <span>Buyer/Seller</span>
          <span class="label">GULA</span>
        </button>
        
        <button class="command-btn secondary" data-cmd="/t5-DGIK">
          <i class="fas fa-users"></i>
          <span>Top Brokers</span>
          <span class="label">DGIK</span>
        </button>
        
        <button class="command-btn secondary" data-cmd="/fl-DGIK">
          <i class="fas fa-water"></i>
          <span>Flow Analysis</span>
          <span class="label">DGIK</span>
        </button>
        
        <button class="command-btn secondary" data-cmd="/rrg-DGIK">
          <i class="fas fa-rocket"></i>
          <span>RRG Matrix</span>
          <span class="label">DGIK</span>
        </button>
      </div>
    </section>
    
    <!-- Search Section -->
    <section class="section">
      <div class="section-title">
        <i class="fas fa-search"></i>
        <span>Custom Analysis</span>
      </div>
      
      <div class="search-box">
        <input type="text" 
               class="search-input" 
               id="stock-input" 
               placeholder="Enter stock code (BBCA, TLKM, BBRI...)"
               autocomplete="off">
        <button class="search-btn" id="analyze-btn">
          <i class="fas fa-chart-line"></i>
          Analyze
        </button>
      </div>
      
      <div class="command-grid">
        <button class="command-btn" data-cmd="/tr-" data-prefix="/tr-">
          <i class="fas fa-chart-line"></i>
          <span>Trendlines</span>
          <span class="label">Any Stock</span>
        </button>
        
        <button class="command-btn" data-cmd="/fc-" data-prefix="/fc-">
          <i class="fas fa-chart-pie"></i>
          <span>FundaChart</span>
          <span class="label">Any Stock</span>
        </button>
        
        <button class="command-btn" data-cmd="/bsd-" data-prefix="/bsd-">
          <i class="fas fa-balance-scale"></i>
          <span>Buyer/Seller</span>
          <span class="label">Any Stock</span>
        </button>
      </div>
    </section>
    
    <!-- Loading Indicator -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">Processing analysis...</div>
    </div>
    
    <!-- Results Section -->
    <div class="result-container" id="result-container">
      <div class="result-header">
        <div class="result-title">
          <i class="fas fa-chart-bar" id="result-icon"></i>
          <span id="result-title">Analysis Results</span>
        </div>
        <button class="close-result" id="close-result">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="result-content" id="result-content">
        <!-- Results will be displayed here -->
      </div>
    </div>
    
    <!-- Notification -->
    <div class="notification" id="notification">
      <i class="fas fa-info-circle"></i>
      <span id="notification-text">Message</span>
    </div>
  </div>

  <script>
    // Configuration
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx0lQNDNGm5nIe5iwZx3MlHMmNWFcYbf32bwmrf2sPkz6Pp13i2ZGuU-wkypVT3yqGHkw/exec';
    
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    
    // App State
    const state = {
      currentStock: '',
      lastCommand: '',
      isProcessing: false
    };
    
    // DOM Elements
    const elements = {
      loading: document.getElementById('loading'),
      loadingText: document.getElementById('loading-text'),
      resultContainer: document.getElementById('result-container'),
      resultTitle: document.getElementById('result-title'),
      resultIcon: document.getElementById('result-icon'),
      resultContent: document.getElementById('result-content'),
      notification: document.getElementById('notification'),
      notificationText: document.getElementById('notification-text'),
      stockInput: document.getElementById('stock-input'),
      analyzeBtn: document.getElementById('analyze-btn'),
      closeResult: document.getElementById('close-result')
    };
    
    // Initialize App
    function initApp() {
      // Expand Telegram WebApp
      tg.expand();
      
      // Setup Telegram Main Button
      tg.MainButton.setText("Open in Telegram");
      tg.MainButton.onClick(() => tg.close());
      tg.MainButton.show();
      
      // Setup event listeners
      setupEventListeners();
      
      // Check for deep link commands
      handleDeepLink();
      
      console.log('App initialized. WebApp version:', tg.version);
    }
    
    // Setup all event listeners
    function setupEventListeners() {
      // Command buttons
      document.querySelectorAll('.command-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const command = this.getAttribute('data-cmd');
          const prefix = this.getAttribute('data-prefix');
          
          if (prefix) {
            // Button needs stock code
            const stock = elements.stockInput.value.trim();
            if (!stock) {
              showNotification('Please enter a stock code first', 'error');
              elements.stockInput.focus();
              return;
            }
            executeCommand(`${prefix}${stock.toUpperCase()}`);
          } else {
            // Button has full command
            executeCommand(command);
          }
        });
      });
      
      // Analyze button
      elements.analyzeBtn.addEventListener('click', () => {
        const stock = elements.stockInput.value.trim();
        if (!stock) {
          showNotification('Please enter a stock code', 'error');
          return;
        }
        executeCommand(`/tr-${stock.toUpperCase()}`);
      });
      
      // Enter key in input
      elements.stockInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          elements.analyzeBtn.click();
        }
      });
      
      // Close result button
      elements.closeResult.addEventListener('click', () => {
        hideResults();
      });
      
      // Telegram events
      tg.onEvent('viewportChanged', tg.expand);
    }
    
    // Execute command
    async function executeCommand(command) {
      if (state.isProcessing) return;
      
      const user = tg.initDataUnsafe.user;
      if (!user || !user.id) {
        showNotification('Please open this app through Telegram', 'error');
        return;
      }
      
      // Show loading
      state.isProcessing = true;
      state.lastCommand = command;
      showLoading(true);
      hideResults();
      
      // Prepare request data
      const requestData = {
        userId: user.id,
        command: command,
        username: user.username || '',
        firstName: user.first_name || 'User',
        source: 'mini_app',
        returnFormat: 'html' // Request HTML format for display
      };
      
      try {
        // Send request to GAS
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestData)
        });
        
        // Note: With 'no-cors' we can't read response directly
        // In a real implementation, you'd handle the response
        
        // For now, simulate successful response with demo data
        setTimeout(() => {
          processCommandResponse(command);
          state.isProcessing = false;
          showLoading(false);
        }, 1500);
        
      } catch (error) {
        console.error('Error:', error);
        showNotification('Failed to send command', 'error');
        state.isProcessing = false;
        showLoading(false);
      }
    }
    
    // Process command response (this would come from GAS in real implementation)
    function processCommandResponse(command) {
      const commandType = command.split('-')[0];
      const stockCode = command.split('-')[1] || '';
      
      // Set result title and icon
      const titles = {
        '/tr': 'Trendlines Analysis',
        '/fc': 'FundaChart Analysis',
        '/bsd': 'Buyer/Seller Analysis',
        '/t5': 'Top 5 Brokers',
        '/fl': 'Flow Analysis',
        '/rrg': 'RRG Matrix',
        '/scr': 'Screener Results',
        '/tng': 'Top Nego Screener',
        '/start': 'Welcome',
        '/help': 'Help Guide'
      };
      
      const icons = {
        '/tr': 'fa-chart-line',
        '/fc': 'fa-chart-pie',
        '/bsd': 'fa-balance-scale',
        '/t5': 'fa-users',
        '/fl': 'fa-water',
        '/rrg': 'fa-rocket',
        '/scr': 'fa-filter',
        '/tng': 'fa-chart-line',
        '/start': 'fa-play',
        '/help': 'fa-question-circle'
      };
      
      elements.resultTitle.textContent = `${titles[commandType] || 'Analysis'} ${stockCode ? `- ${stockCode}` : ''}`;
      elements.resultIcon.className = `fas ${icons[commandType] || 'fa-chart-bar'}`;
      
      // Generate demo content based on command type
      let content = '';
      
      switch(commandType) {
        case '/fc':
          content = generateFundaChartContent(stockCode);
          break;
        case '/tr':
          content = generateTrendlinesContent(stockCode);
          break;
        case '/bsd':
          content = generateBuyerSellerContent(stockCode);
          break;
        case '/start':
          content = generateWelcomeContent();
          break;
        case '/help':
          content = generateHelpContent();
          break;
        default:
          content = generateDefaultContent(command, stockCode);
      }
      
      elements.resultContent.innerHTML = content;
      showResults();
      showNotification(`Analysis completed for ${stockCode || 'command'}`, 'success');
    }
    
    // Demo content generators
    function generateFundaChartContent(stockCode) {
      return `
        <div class="analysis-card success">
          <div class="card-title">
            <i class="fas fa-check-circle"></i>
            <span>📊 FundaChart Analysis - ${stockCode}</span>
          </div>
          <div class="card-content">
            <p>"Jika publik menurun, harganya dapat dengan mudah naik."</p>
            <p>Fundamental kuat dengan valuasi menarik.</p>
          </div>
          
          <div class="metric-grid">
            <div class="metric">
              <div class="metric-label">Fundamental Score</div>
              <div class="metric-value positive">7.8/10</div>
            </div>
            <div class="metric">
              <div class="metric-label">Valuation</div>
              <div class="metric-value positive">UNDERVALUED</div>
            </div>
            <div class="metric">
              <div class="metric-label">P/E Ratio</div>
              <div class="metric-value">12.5x</div>
            </div>
            <div class="metric">
              <div class="metric-label">ROE</div>
              <div class="metric-value positive">18.5%</div>
            </div>
          </div>
        </div>
        
        <div class="analysis-card">
          <div class="card-title">

    // UI Helper Functions
    function showLoading(show) {
      elements.loading.classList.toggle('active', show);
      elements.loadingText.textContent = show ? 
        `Processing ${state.lastCommand}...` : 
        'Processing analysis...';
    }
    
    function showResults() {
      elements.resultContainer.classList.add('active');
    }
    
    function hideResults() {
      elements.resultContainer.classList.remove('active');
    }
    
    function showNotification(message, type = 'info') {
      elements.notificationText.textContent = message;
      elements.notification.className = `notification ${type}`;
      elements.notification.querySelector('i').className = {
        success: 'fas fa-check-circle',
        error: 'fas fa-exclamation-circle',
        info: 'fas fa-info-circle'
      }[type] || 'fas fa-info-circle';
      
      elements.notification.classList.add('show');
      
      setTimeout(() => {
        elements.notification.classList.remove('show');
      }, 3000);
    }
    
    // Handle deep linking from Telegram
    function handleDeepLink() {
      const startParam = tg.initDataUnsafe.start_param;
      if (startParam && startParam.startsWith('cmd_')) {
        const command = startParam.replace('cmd_', '/').replace(/_/g, '-');
        setTimeout(() => executeCommand(command), 1000);
      }
    }
    
    // Initialize app when page loads
    document.addEventListener('DOMContentLoaded', initApp);
