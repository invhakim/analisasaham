<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Holistik Pro Investment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ===== VARIABLES & RESET ===== */
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #10b981;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --dark: #0f172a;
      --darker: #020617;
      --light: #f8fafc;
      --gray: #94a3b8;
      --dark-gray: #475569;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-border: rgba(71, 85, 105, 0.3);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
      color: var(--light);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.6;
    }
    
    .container {
      max-width: 100%;
      margin: 0 auto;
    }
    
    /* ===== HEADER ===== */
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .header p {
      color: var(--gray);
      font-size: 14px;
    }
    
    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(37, 99, 235, 0.1);
      border-radius: 20px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--light);
    }
    
    /* ===== COMMAND SECTIONS ===== */
    .section {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }
    
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--light);
      font-size: 16px;
      font-weight: 600;
    }
    
    .section-title i {
      color: var(--primary);
      width: 20px;
    }
    
    /* ===== COMMAND BUTTONS ===== */
    .command-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    
    @media (max-width: 640px) {
      .command-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    .command-btn {
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--light);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .command-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
    }
    
    .command-btn:active {
      transform: translateY(0);
    }
    
    .command-btn i {
      font-size: 20px;
      color: var(--primary);
    }
    
    .command-btn .command-text {
      font-size: 13px;
      font-weight: 600;
    }
    
    .command-btn .description {
      font-size: 11px;
      color: var(--gray);
      opacity: 0.8;
    }
    
    /* Button Variants */
    .command-btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
    }
    
    .command-btn.primary i {
      color: white;
    }
    
    .command-btn.secondary {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.2);
    }
    
    .command-btn.secondary i {
      color: var(--secondary);
    }
    
    .command-btn.warning {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.2);
    }
    
    .command-btn.warning i {
      color: var(--warning);
    }
    
    /* ===== SEARCH SECTION ===== */
    .search-section {
      margin-bottom: 20px;
    }
    
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    
    .search-input {
      flex: 1;
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--light);
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .search-input::placeholder {
      color: var(--gray);
    }
    
    .search-btn {
      padding: 0 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    
    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    
    /* ===== RESULT DISPLAY ===== */
    .result-container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid var(--card-border);
      display: none;
      animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .result-container.active {
      display: block;
    }
    
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }
    
    .result-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: var(--light);
    }
    
    .result-title i {
      color: var(--primary);
    }
    
    .close-result {
      background: none;
      border: none;
      color: var(--gray);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    
    .close-result:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--light);
    }
    
    /* Analysis Cards */
    .analysis-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--primary);
      transition: transform 0.2s;
    }
    
    .analysis-card:hover {
      transform: translateX(2px);
    }
    
    .analysis-card.success {
      border-left-color: var(--success);
    }
    
    .analysis-card.warning {
      border-left-color: var(--warning);
    }
    
    .analysis-card.danger {
      border-left-color: var(--danger);
    }
    
    .analysis-card.info {
      border-left-color: var(--info);
    }
    
    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--light);
    }
    
    .card-title i {
      font-size: 16px;
    }
    
    .card-content {
      color: var(--gray);
      font-size: 13px;
      line-height: 1.5;
    }
    
    .card-content p {
      margin-bottom: 8px;
    }
    
    /* Metric Grid */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    
    .metric {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    
    .metric-label {
      font-size: 11px;
      color: var(--gray);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .metric-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--light);
    }
    
    .metric-value.positive {
      color: var(--success);
    }
    
    .metric-value.negative {
      color: var(--danger);
    }
    
    .metric-value.neutral {
      color: var(--warning);
    }
    
    /* Recommendation Badge */
    .recommendation {
      display: inline-block;
      padding: 4px 10px;
      background: var(--success);
      color: white;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }
    
    .recommendation.buy {
      background: var(--success);
    }
    
    .recommendation.sell {
      background: var(--danger);
    }
    
    .recommendation.hold {
      background: var(--warning);
    }
    
    /* ===== LOADING INDICATOR ===== */
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }
    
    .loading.active {
      display: block;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: var(--gray);
      font-size: 14px;
    }
    
    /* ===== NOTIFICATION ===== */
    .notification {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      color: var(--light);
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    
    .notification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    .notification i {
      font-size: 16px;
    }
    
    .notification.success {
      border-left: 4px solid var(--success);
    }
    
    .notification.error {
      border-left: 4px solid var(--danger);
    }
    
    .notification.info {
      border-left: 4px solid var(--info);
    }
    
    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      
      .header {
        padding: 16px;
        margin-bottom: 20px;
      }
      
      .section {
        padding: 16px;
      }
      
      .command-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      
      .search-box {
        flex-direction: column;
      }
      
      .search-btn {
        justify-content: center;
        padding: 14px;
      }
      
      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 3px;
    }
    
    /* ===== UTILITIES ===== */
    .hidden {
      display: none !important;
    }
    
    .text-center {
      text-align: center;
    }
    
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    
    /* Loading Dots dari kode pertama */
    .loading-dots {
      display: inline-block;
      position: relative;
      width: 20px;
      height: 20px;
    }
    
    .loading-dots::after {
      content: " ";
      display: block;
      border-radius: 50%;
      width: 0;
      height: 0;
      margin: 8px;
      box-sizing: border-box;
      border: 8px solid currentColor;
      border-color: currentColor transparent currentColor transparent;
      animation: loading-dots 1.2s infinite;
    }
    
    @keyframes loading-dots {
      0% { transform: rotate(0); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
      50% { transform: rotate(900deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
      100% { transform: rotate(1800deg); }
    }
    
    /* ===== INPUT PERSISTENT ===== */
    .search-input.persistent {
      border-color: var(--primary);
      background: rgba(37, 99, 235, 0.1);
    }
    
    .recent-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    
    .recent-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 20px;
      font-size: 12px;
      color: var(--light);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .recent-badge:hover {
      background: rgba(16, 185, 129, 0.2);
      transform: translateY(-1px);
    }
    
    .recent-badge i {
      font-size: 10px;
      color: var(--secondary);
    }

    .pe-stats-icon {
      position: relative;
    }
    
    .pe-stats-icon::after {
      content: 'σ';
      position: absolute;
      top: -2px;
      right: -2px;
      font-size: 8px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      width: 12px;
      height: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
        
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1><i class="fas fa-chart-network"></i> Holistik Pro Investment</h1>
      <p>Advanced Technical Analysis Tools for Telegram</p>
      <div class="user-badge" id="userBadge">
        <i class="fas fa-user"></i>
        <span id="userName">Loading...</span>
      </div>
    </header>
    
    <!-- Quick Actions Section -->
    <section class="section">
      <div class="section-title">
        <i class="fas fa-bolt"></i>
        <span>Quick Actions</span>
      </div>
      <div class="command-grid">
        <button class="command-btn primary" data-cmd="/start">
          <i class="fas fa-play"></i>
          <span class="command-text">Start Bot</span>
          <span class="description">Initialize bot</span>
        </button>
        
        <button class="command-btn primary" data-cmd="/help">
          <i class="fas fa-question-circle"></i>
          <span class="command-text">Help Guide</span>
          <span class="description">Show help</span>
        </button>
                
        <button class="command-btn warning" data-cmd="/tng">
          <i class="fas fa-fire"></i>
          <span class="command-text">Top Nego</span>
          <span class="description">Running trade</span>
        </button>
      </div>
    </section>

     <!-- SCRENER -->
    <section class="section">
      <div class="section-title">
        <i class="fa-solid fa-bullseye"></i>
        <span>Screener</span>
      </div>
      
      <div class="command-grid">
        <button class="command-btn warning" data-cmd="/scr-holder">
          <i class="fas fa-filter"></i>
          <span class="command-text">Holder</span>
          <span class="description">Stock screener</span>
        </button>
        
        <button class="command-btn warning" data-cmd="/scr-bsjp">
          <i class="fa-solid fa-clock"></i>
          <span class="command-text">BSJP</span>
          <span class="description">Menyaring saham yang hari ini naik >7% dari open, volume ≥2×, likuid. ≥2% esok hari.</span>
        </button>
        
        <button class="command-btn warning" data-cmd="/scr-ara">
          <i class="fa-solid fa-rocket"></i>
          <span class="command-text">Calon ARA</span>
          <span class="description">Mencari saham yang mulai dipanaskan: volume, akumulasi, dan harga tetap di atas MA50.
</span>
        </button>
      </div>
    </section>
    
    
    
    <!-- Custom Analysis Section -->
    <section class="section search-section">
      <div class="section-title">
        <i class="fas fa-search"></i>
        <span>Custom Analysis</span>
      </div>
      
      <div class="search-box">
        <input type="text" 
               class="search-input" 
               id="stockInput" 
               placeholder="Enter stock code (BBCA, TLKM, BBRI...)"
               autocomplete="off"
               autocapitalize="characters"
               value="">
        <button class="search-btn" id="analyzeBtn">
          <i class="fas fa-chart-line"></i>
          <span>Analyze</span>
        </button>
      </div>
      
      <div class="recent-actions" id="recentActions">
        <!-- Recent actions akan ditampilkan di sini -->
      </div>
      
      <div class="command-grid">
        <button class="command-btn" data-prefix="/fc-">
          <i class="fas fa-chart-pie"></i>
          <span class="command-text">FundaChart</span>
          <span class="description">Fundamental</span>
        </button>
        
        <button class="command-btn" data-prefix="/tr-">
          <i class="fas fa-chart-line"></i>
          <span class="command-text">Trendlines</span>
          <span class="description">Technical</span>
        </button>
        
        <button class="command-btn" data-prefix="/bsd-">
          <i class="fas fa-balance-scale"></i>
          <span class="command-text">Buyer/Seller</span>
          <span class="description">Volume</span>
        </button>

        <button class="command-btn" data-prefix="/t5">
          <i class="fas fa-users"></i>
          <span class="command-text">Top 5 Brokers</span>
          <span class="description">Broker Ranking</span>
        </button>
        
        <button class="command-btn" data-prefix="/fl">
          <i class="fas fa-project-diagram"></i>
          <span class="command-text">Flow Analysis</span>
          <span class="description">Broker Flow</span>
        </button>

        <button class="command-btn" data-prefix="/pe-">
          <i class="fas fa-chart-bar pe-stats-icon"></i>
          <span class="command-text">Financial Metrics</span>
          <span class="description">PE Standard Deviation</span>
        </button>
        
        <button class="command-btn" data-prefix="/rrg-">
          <i class="fas fa-rocket"></i>
          <span class="command-text">RRG Matrix</span>
          <span class="description">Rotation</span>
        </button>

        

        
      </div>
    </section>
    
    <!-- Popular Stocks Section -->
    <section class="section">
      <div class="section-title">
        <i class="fas fa-star"></i>
        <span>Popular Analysis</span>
      </div>
      <div class="command-grid">
        <button class="command-btn secondary" data-cmd="/fc-BUMI">
          <i class="fas fa-chart-pie"></i>
          <span class="command-text">BUMI</span>
          <span class="description">FundaChart</span>
        </button>
        
        <button class="command-btn secondary" data-cmd="/tr-DGIK">
          <i class="fas fa-chart-line"></i>
          <span class="command-text">DGIK</span>
          <span class="description">Trendlines</span>
        </button>
        
        <button class="command-btn secondary" data-cmd="/bsd-GULA">
          <i class="fas fa-balance-scale"></i>
          <span class="command-text">GULA</span>
          <span class="description">Buyer/Seller</span>
        </button>
        
        <button class="command-btn secondary" data-cmd="/t5DGIK">
          <i class="fas fa-users"></i>
          <span class="command-text">DGIK</span>
          <span class="description">Top Brokers</span>
        </button>
      </div>
    </section>
    
    <!-- Loading Indicator -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Processing analysis...</div>
    </div>
    
    <!-- Results Display -->
    <div class="result-container" id="resultContainer">
      <div class="result-header">
        <div class="result-title">
          <i class="fas fa-chart-bar" id="resultIcon"></i>
          <span id="resultTitle">Analysis Results</span>
        </div>
        <button class="close-result" id="closeResult">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="result-content" id="resultContent">
        <!-- Results will be dynamically inserted here -->
      </div>
    </div>
  </div>
  
  <!-- Notification -->
  <div class="notification" id="notification">
    <i class="fas fa-info-circle"></i>
    <span id="notificationText">Message</span>
  </div>

  <script>
    // ===== KONFIGURASI =====
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwNQ9u-QjsFWZOBvfFD4bvBx86pFigF3ngRIDiz37J3p8Ei5NrLkDFuMNBeu-McqwtG/exec';

    // ===== INISIALISASI =====
    const tg = window.Telegram.WebApp;

    // ===== VARIABEL GLOBAL =====
    let recentActions = JSON.parse(localStorage.getItem('holistik_recent_actions') || '[]');
    let currentStockCode = '';

    // ===== NOTIFICATION SYSTEM =====
    let notificationTimeout;

    function showNotification(message, type = 'info', duration = 3000) {
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        const icon = notification.querySelector('i');
        
        // Set message and type
        notificationText.textContent = message;
        notification.className = `notification ${type}`;
        
        // Update icon based on type
        const icons = {
            success: 'fa-check-circle',
            error: 'fa-exclamation-circle',
            warning: 'fa-exclamation-triangle',
            info: 'fa-info-circle'
        };
        icon.className = `fas ${icons[type] || icons.info}`;
        
        // Show notification
        notification.classList.add('show');
        
        // Auto hide
        clearTimeout(notificationTimeout);
        notificationTimeout = setTimeout(() => {
            notification.classList.remove('show');
        }, duration);
    }

    // ===== FUNGSI UNTUK MENYIMPAN AKSI TERAKHIR =====
    function saveRecentAction(stockCode, commandType) {
        // Simpan kode saham saat ini
        currentStockCode = stockCode;
        
        // Tambah aksi ke daftar recent
        const action = {
            stockCode: stockCode,
            commandType: commandType,
            timestamp: new Date().getTime()
        };
        
        // Hapus duplikat berdasarkan stockCode dan commandType
        recentActions = recentActions.filter(a => 
            !(a.stockCode === stockCode && a.commandType === commandType)
        );
        
        // Tambah ke awal array
        recentActions.unshift(action);
        
        // Simpan maksimal 5 aksi
        if (recentActions.length > 5) {
            recentActions = recentActions.slice(0, 5);
        }
        
        // Simpan ke localStorage
        localStorage.setItem('holistik_recent_actions', JSON.stringify(recentActions));
        
        // Update tampilan recent actions
        updateRecentActions();
    }

    // ===== FUNGSI UNTUK UPDATE TAMPILAN RECENT ACTIONS =====
    function updateRecentActions() {
        const recentActionsContainer = document.getElementById('recentActions');
        
        if (recentActions.length === 0) {
            recentActionsContainer.innerHTML = '';
            return;
        }
        
        let html = '';
        recentActions.forEach(action => {
            const commandName = getCommandName(action.commandType);
            const timeAgo = getTimeAgo(action.timestamp);
            
            html += `
                <div class="recent-badge" data-stock="${action.stockCode}" data-type="${action.commandType}">
                    <i class="fas fa-history"></i>
                    <span>${action.stockCode} - ${commandName}</span>
                    <span style="font-size: 10px; opacity: 0.7;">(${timeAgo})</span>
                </div>
            `;
        });
        
        recentActionsContainer.innerHTML = html;
        
        // Tambah event listener untuk recent badges
        document.querySelectorAll('.recent-badge').forEach(badge => {
            badge.addEventListener('click', function() {
                const stockCode = this.getAttribute('data-stock');
                const commandType = this.getAttribute('data-type');
                
                // Set input dengan kode saham
                document.getElementById('stockInput').value = stockCode;
                document.getElementById('stockInput').classList.add('persistent');
                
                // Kirim perintah
                sendTelegramCommand(`${commandType}${stockCode}`);
            });
        });
    }

    // ===== FUNGSI BANTUAN =====
    function getCommandName(commandType) {
        const commandMap = {
            '/fc-': 'FundaChart',
            '/tr-': 'Trendlines',
            '/bsd-': 'Buyer/Seller',
            '/rrg-': 'RRG Matrix',
            '/t5': 'Top 5 Brokers',
            '/fl': 'Flow Analysis'
        };
        
        return commandMap[commandType] || 'Analysis';
    }

    function getTimeAgo(timestamp) {
        const now = new Date().getTime();
        const diff = now - timestamp;
        
        const minutes = Math.floor(diff / (1000 * 60));
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        
        if (minutes < 1) return 'just now';
        if (minutes < 60) return `${minutes}m ago`;
        if (hours < 24) return `${hours}h ago`;
        return `${days}d ago`;
    }

    // ===== FUNGSI UTAMA =====
    async function sendTelegramCommand(commandText) {
        const user = tg.initDataUnsafe.user;
        
        if (!user || !user.id) {
            showNotification("Open this app through Telegram to use this feature", "error");
            return;
        }
        
        // Dapatkan kode saham dari command
        const stockMatch = commandText.match(/-\s*([A-Z]+)/);
        if (stockMatch && stockMatch[1]) {
            currentStockCode = stockMatch[1];
            document.getElementById('stockInput').value = currentStockCode;
            document.getElementById('stockInput').classList.add('persistent');
        }
        
        // Simpan ke recent actions jika ada kode saham
        const commandType = commandText.substring(0, commandText.lastIndexOf('-') + 1);
        const stockCode = currentStockCode || document.getElementById('stockInput').value.trim().toUpperCase();
        
        if (stockCode && (commandText.includes('/fc-') || commandText.includes('/tr-') || 
            commandText.includes('/bsd-') || commandText.includes('/rrg-') || 
            commandText.includes('/t5') || commandText.includes('/fl'))) {
            saveRecentAction(stockCode, commandType);
        }
        
        // Tampilkan loading state
        const buttons = document.querySelectorAll('.command-btn, .search-btn');
        buttons.forEach(btn => {
            btn.disabled = true;
            const originalText = btn.innerHTML;
            btn.dataset.originalText = originalText;
            btn.innerHTML = `<span class="loading-dots"></span>`;
        });
        
        showNotification(`Sending command: ${commandText}...`, "info");
        
        const requestData = {
            userId: user.id,
            command: commandText,
            username: user.username || '',
            firstName: user.first_name || 'User',
            source: 'mini_app'
        };
        
        try {
            // Kirim ke Google Apps Script
            await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            });
            
            // Beri feedback sukses
            showNotification(`✅ Command "${commandText}" sent! Check your Telegram chat.`, "success");
            
            // Getar jika didukung
            try {
                if (tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            } catch (e) {
                console.log('Haptic feedback not available');
            }
            
            // JANGAN HAPUS INPUT - Biarkan input tetap ada
            // Hanya highlight input field
            const stockInput = document.getElementById('stockInput');
            stockInput.classList.add('persistent');
            
        } catch (error) {
            console.error('Error:', error);
            showNotification('❌ Failed to send command. Please try again.', "error");
        } finally {
            // Restore buttons
            setTimeout(() => {
                buttons.forEach(btn => {
                    btn.disabled = false;
                    if (btn.dataset.originalText) {
                        btn.innerHTML = btn.dataset.originalText;
                    }
                });
            }, 500);
        }
    }

    // ===== SETUP EVENT LISTENERS =====
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Web App Version:', tg.version);
        console.log('User:', tg.initDataUnsafe.user);
        
        // Setup Telegram WebApp
        tg.expand();
        
        // Update user info
        const user = tg.initDataUnsafe.user;
        if (user) {
            const userName = user.username || user.first_name || 'User';
            document.getElementById('userName').textContent = userName;
        }
        
        // Tampilkan recent actions
        updateRecentActions();
        
        // Setup command buttons dengan data-cmd
        document.querySelectorAll('.command-btn[data-cmd]').forEach(button => {
            button.addEventListener('click', function() {
                const command = this.getAttribute('data-cmd');
                if (command) {
                    sendTelegramCommand(command);
                }
            });
        });
        
        // Setup command buttons dengan data-prefix
        document.querySelectorAll('.command-btn[data-prefix]').forEach(button => {
            button.addEventListener('click', function() {
                const stockCode = document.getElementById('stockInput').value.trim().toUpperCase();
                if (!stockCode) {
                    showNotification("Please enter a stock code first!", "warning");
                    return;
                }
                const prefix = this.getAttribute('data-prefix');
                sendTelegramCommand(`${prefix}${stockCode}`);
            });
        });
        
        // Setup analyze button (default: trendlines)
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const stockCode = document.getElementById('stockInput').value.trim().toUpperCase();
            if (!stockCode) {
                showNotification("Please enter a stock code first!", "warning");
                return;
            }
            sendTelegramCommand(`/${stockCode}`);
        });
        
        // Enter key support
        document.getElementById('stockInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('analyzeBtn').click();
            }
        });
        
        // Ketika input diubah, hilangkan highlight
        document.getElementById('stockInput').addEventListener('input', function() {
            this.classList.remove('persistent');
        });
        
        // Close result button
        document.getElementById('closeResult').addEventListener('click', function() {
            document.getElementById('resultContainer').classList.remove('active');
        });
        
        // Telegram Main Button
        tg.MainButton.setText("Open in Telegram");
        tg.MainButton.onClick(() => {
            tg.close();
        });
        tg.MainButton.show();
        
        // Handle deep linking
        const startParam = tg.initDataUnsafe.start_param;
        if (startParam && startParam.startsWith('cmd_')) {
            const command = startParam.replace('cmd_', '/').replace(/_/g, '-');
            setTimeout(() => sendTelegramCommand(command), 1000);
        }
        
        // Tambahkan contoh kode saham yang sering digunakan
        const popularStocks = ['BBCA', 'TLKM', 'BBRI', 'ASII', 'UNVR'];
        const popularContainer = document.getElementById('recentActions');
        
        // Tambah tombol untuk kode saham populer jika belum ada recent actions
        if (recentActions.length === 0) {
            let popularHtml = '<div style="font-size: 12px; color: var(--gray); margin-bottom: 8px;">Popular: </div>';
            popularStocks.forEach(stock => {
                popularHtml += `
                    <div class="recent-badge" data-stock="${stock}" data-type="/tr-">
                        <i class="fas fa-star"></i>
                        <span>${stock}</span>
                    </div>
                `;
            });
            
            // Tambah ke container jika kosong
            if (popularContainer.innerHTML === '') {
                popularContainer.innerHTML = popularHtml;
                
                // Tambah event listener untuk popular stocks
                document.querySelectorAll('.recent-badge[data-stock]').forEach(badge => {
                    badge.addEventListener('click', function() {
                        const stockCode = this.getAttribute('data-stock');
                        const commandType = this.getAttribute('data-type') || '/tr-';
                        
                        // Set input dengan kode saham
                        document.getElementById('stockInput').value = stockCode;
                        document.getElementById('stockInput').classList.add('persistent');
                        
                        // Kirim perintah
                        sendTelegramCommand(`${commandType}${stockCode}`);
                    });
                });
            }
        }
    });
  </script>
