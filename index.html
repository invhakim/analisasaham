<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Holistik Pro Investment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ===== VARIABLES & RESET ===== */
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #10b981;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --dark: #0f172a;
      --darker: #020617;
      --light: #f8fafc;
      --gray: #94a3b8;
      --dark-gray: #475569;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-border: rgba(71, 85, 105, 0.3);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
      color: var(--light);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.6;
    }
    
    .container {
      max-width: 100%;
      margin: 0 auto;
    }
    
    /* ===== HEADER ===== */
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .header p {
      color: var(--gray);
      font-size: 14px;
    }
    
    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(37, 99, 235, 0.1);
      border-radius: 20px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--light);
    }
    
    /* ===== COMMAND SECTIONS ===== */
    .section {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }
    
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--light);
      font-size: 16px;
      font-weight: 600;
    }
    
    .section-title i {
      color: var(--primary);
      width: 20px;
    }
    
    /* ===== COMMAND BUTTONS ===== */
    .command-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    
    @media (max-width: 640px) {
      .command-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    .command-btn {
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--light);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .command-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
    }
    
    .command-btn:active {
      transform: translateY(0);
    }
    
    .command-btn i {
      font-size: 20px;
      color: var(--primary);
    }
    
    .command-btn .command-text {
      font-size: 13px;
      font-weight: 600;
    }
    
    .command-btn .description {
      font-size: 11px;
      color: var(--gray);
      opacity: 0.8;
    }
    
    /* Button Variants */
    .command-btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
    }
    
    .command-btn.primary i {
      color: white;
    }
    
    .command-btn.secondary {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.2);
    }
    
    .command-btn.secondary i {
      color: var(--secondary);
    }
    
    .command-btn.warning {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.2);
    }
    
    .command-btn.warning i {
      color: var(--warning);
    }
    
    /* ===== SEARCH SECTION ===== */
    .search-section {
      margin-bottom: 20px;
    }
    
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    
    .search-input {
      flex: 1;
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--light);
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .search-input::placeholder {
      color: var(--gray);
    }
    
    .search-btn {
      padding: 0 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    
    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    
    /* ===== RESULT DISPLAY ===== */
    .result-container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid var(--card-border);
      display: none;
      animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .result-container.active {
      display: block;
    }
    
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }
    
    .result-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: var(--light);
    }
    
    .result-title i {
      color: var(--primary);
    }
    
    .close-result {
      background: none;
      border: none;
      color: var(--gray);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    
    .close-result:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--light);
    }
    
    /* Analysis Cards */
    .analysis-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--primary);
      transition: transform 0.2s;
    }
    
    .analysis-card:hover {
      transform: translateX(2px);
    }
    
    .analysis-card.success {
      border-left-color: var(--success);
    }
    
    .analysis-card.warning {
      border-left-color: var(--warning);
    }
    
    .analysis-card.danger {
      border-left-color: var(--danger);
    }
    
    .analysis-card.info {
      border-left-color: var(--info);
    }
    
    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--light);
    }
    
    .card-title i {
      font-size: 16px;
    }
    
    .card-content {
      color: var(--gray);
      font-size: 13px;
      line-height: 1.5;
    }
    
    .card-content p {
      margin-bottom: 8px;
    }
    
    /* Metric Grid */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    
    .metric {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    
    .metric-label {
      font-size: 11px;
      color: var(--gray);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .metric-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--light);
    }
    
    .metric-value.positive {
      color: var(--success);
    }
    
    .metric-value.negative {
      color: var(--danger);
    }
    
    .metric-value.neutral {
      color: var(--warning);
    }
    
    /* Recommendation Badge */
    .recommendation {
      display: inline-block;
      padding: 4px 10px;
      background: var(--success);
      color: white;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }
    
    .recommendation.buy {
      background: var(--success);
    }
    
    .recommendation.sell {
      background: var(--danger);
    }
    
    .recommendation.hold {
      background: var(--warning);
    }
    
    /* ===== LOADING INDICATOR ===== */
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }
    
    .loading.active {
      display: block;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: var(--gray);
      font-size: 14px;
    }
    
    /* ===== NOTIFICATION ===== */
    .notification {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      color: var(--light);
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    
    .notification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    .notification i {
      font-size: 16px;
    }
    
    .notification.success {
      border-left: 4px solid var(--success);
    }
    
    .notification.error {
      border-left: 4px solid var(--danger);
    }
    
    .notification.info {
      border-left: 4px solid var(--info);
    }
    
    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      
      .header {
        padding: 16px;
        margin-bottom: 20px;
      }
      
      .section {
        padding: 16px;
      }
      
      .command-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      
      .search-box {
        flex-direction: column;
      }
      
      .search-btn {
        justify-content: center;
        padding: 14px;
      }
      
      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 3px;
    }
    
    /* ===== UTILITIES ===== */
    .hidden {
      display: none !important;
    }
    
    .text-center {
      text-align: center;
    }
    
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1><i class="fas fa-chart-network"></i> Holistik Pro Investment</h1>
      <p>Advanced Technical Analysis Tools for Telegram</p>
      <div class="user-badge" id="userBadge">
        <i class="fas fa-user"></i>

    <!-- Quick Actions Section -->
    <section class="section">

      </div>
      <div class="command-grid">
        <button class="command-btn primary" data-cmd="/start">

        <button class="command-btn warning" data-cmd="/scr">

    <!-- Popular Stocks Section -->
    <section class="section">
      <div class="section-title">

      <div class="command-grid">
        <button class="command-btn secondary" data-cmd="/fc-BUMI">

        <button class="command-btn secondary" data-cmd="/tr-DGIK">

        <button class="command-btn secondary" data-cmd="/t5-DGIK">

        </button>
      </div>
    </section>
    
    <!-- Custom Analysis Section -->
    <section class="section search-section">
      <div class="section-title">
        <i class="fas fa-search"></i>
        <span>Custom Analysis</span>
      </div>
      
      <div class="search-box">
        <input type="text" 
               class="search-input" 
               id="stockInput" 
               placeholder="Enter stock code (BBCA, TLKM, BBRI...)"
               autocomplete="off"
               autocapitalize="characters">
        <button class="search-btn" id="analyzeBtn">
          <i class="fas fa-chart-line"></i>
          <span>Analyze</span>
        </button>
      </div>
      
      <div class="command-grid">
        <button class="command-btn" data-prefix="/fc-">
          <i class="fas fa-chart-pie"></i>
          <span class="command-text">FundaChart</span>
          <span class="description">Fundamental</span>
        </button>
        
        <button class="command-btn" data-prefix="/tr-">
          <i class="fas fa-chart-line"></i>
          <span class="command-text">Trendlines</span>
          <span class="description">Technical</span>
        </button>
        
        <button class="command-btn" data-prefix="/bsd-">
          <i class="fas fa-balance-scale"></i>
          <span class="command-text">Buyer/Seller</span>
          <span class="description">Volume</span>
        </button>
        
        <button class="command-btn" data-prefix="/rrg-">
          <i class="fas fa-rocket"></i>
          <span class="command-text">RRG Matrix</span>
          <span class="description">Rotation</span>
        </button>
      </div>
    </section>
    
    <!-- Loading Indicator -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Processing analysis...</div>
    </div>
    
    <!-- Results Display -->
    <div class="result-container" id="resultContainer">
      <div class="result-header">
        <div class="result-title">
          <i class="fas fa-chart-bar" id="resultIcon"></i>
          <span id="resultTitle">Analysis Results</span>
        </div>
        <button class="close-result" id="closeResult">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="result-content" id="resultContent">
        <!-- Results will be dynamically inserted here -->
      </div>
    </div>
  </div>
  
  <!-- Notification -->
  <div class="notification" id="notification">
    <i class="fas fa-info-circle"></i>
    <span id="notificationText">Message</span>
  </div>

  <!-- JavaScript -->
  <script>
    // ============================================================================
    // CONFIGURATION
    // ============================================================================
    // GANTI URL INI dengan URL Google Apps Script Anda setelah deploy
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx0lQNDNGm5nIe5iwZx3MlHMmNWFcYbf32bwmrf2sPkz6Pp13i2ZGuU-wkypVT3yqGHkw/exec';
    
    // ============================================================================
    // TELEGRAM WEBAPP INITIALIZATION
    // ============================================================================
    const tg = window.Telegram.WebApp;
    let isProcessing = false;
    
    // ============================================================================
    // DOM ELEMENTS
    // ============================================================================
    const elements = {
      loading: document.getElementById('loading'),
      loadingText: document.getElementById('loadingText'),
      resultContainer: document.getElementById('resultContainer'),
      resultTitle: document.getElementById('resultTitle'),
      resultIcon: document.getElementById('resultIcon'),
      resultContent: document.getElementById('resultContent'),
      notification: document.getElementById('notification'),
      notificationText: document.getElementById('notificationText'),
      stockInput: document.getElementById('stockInput'),
      analyzeBtn: document.getElementById('analyzeBtn'),
      closeResult: document.getElementById('closeResult'),
      userBadge: document.getElementById('userBadge'),
      userName: document.getElementById('userName')
    };
    
    // ============================================================================
    // INITIALIZATION
    // ============================================================================
    function initApp() {
      try {
        // Expand Telegram WebApp
        tg.expand();
        
        // Setup Telegram Main Button
        tg.MainButton.setText("💬 Open Chat");
        tg.MainButton.onClick(() => {
          tg.close();
        });
        tg.MainButton.show();
        
        // Update user info
        updateUserInfo();
        
        // Setup event listeners
        setupEventListeners();
        
        // Handle deep linking
        handleDeepLink();
        
        console.log('✅ Holistik Pro Mini App initialized');
        console.log('📱 WebApp Version:', tg.version);
        console.log('👤 User:', tg.initDataUnsafe.user);
        
      } catch (error) {
        console.error('❌ Error initializing app:', error);
        showNotification('Failed to initialize app', 'error');
      }
    }
    
    // ============================================================================
    // EVENT LISTENERS
    // ============================================================================
    function setupEventListeners() {
      // Command buttons with full commands
      document.querySelectorAll('.command-btn[data-cmd]').forEach(btn => {
        btn.addEventListener('click', function() {
          const command = this.getAttribute('data-cmd');
          executeCommand(command);
        });
      });
      
      // Command buttons with prefixes (need stock code)
      document.querySelectorAll('.command-btn[data-prefix]').forEach(btn => {
        btn.addEventListener('click', function() {
          const prefix = this.getAttribute('data-prefix');
          const stockCode = elements.stockInput.value.trim().toUpperCase();
          
          if (!stockCode) {
            showNotification('Please enter a stock code first', 'error');
            elements.stockInput.focus();
            return;
          }
          
          executeCommand(`${prefix}${stockCode}`);
        });
      });
      
      // Analyze button (default: Trendlines)
      elements.analyzeBtn.addEventListener('click', () => {
        const stockCode = elements.stockInput.value.trim().toUpperCase();
        if (!stockCode) {
          showNotification('Please enter a stock code', 'error');
          elements.stockInput.focus();
          return;
        }
        executeCommand(`/tr-${stockCode}`);
      });
      
      // Enter key in stock input
      elements.stockInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          elements.analyzeBtn.click();
        }
      });
      
      // Close result button
      elements.closeResult.addEventListener('click', hideResults);
      
      // Telegram viewport changes
      tg.onEvent('viewportChanged', tg.expand);
    }

    // Fungsi untuk handle klik tombol screener
document.addEventListener('DOMContentLoaded', function() {
  const screenerBtn = document.querySelector('[data-cmd="/scr"]');
  
  if (screenerBtn) {
    screenerBtn.addEventListener('click', function(e) {
      e.preventDefault();
      executeCommand('/scr');
    });
  }
});

// Fungsi utama untuk execute command
async function executeCommand(command) {
  const loadingId = 'loading-' + Date.now();
  showLoading(loadingId, 'Mengambil data screener...');
  
  try {
    // URL GAS Anda
    const gasUrl = 'https://script.google.com/macros/s/AKfycbx0lQNDNGm5nIe5iwZx3MlHMmNWFcYbf32bwmrf2sPkz6Pp13i2ZGuU-wkypVT3yqGHkw/exec';
    
    // Data yang dikirim
    const requestData = {
      command: command,
      userId: getUserId(), // Fungsi untuk mendapatkan user ID
      chatId: getChatId(), // Jika di Telegram Mini App
      timestamp: new Date().toISOString()
    };
    
    console.log('Sending request to GAS:', requestData);
    
    // Gunakan fetch dengan timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 detik timeout
    
    const response = await fetch(gasUrl, {
      method: 'POST',
      mode: 'no-cors', // Penting untuk CORS
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(requestData),
      signal: controller.signal
    });
    
    clearTimeout(timeoutId);
    
    console.log('Response status:', response.status);
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const result = await response.json();
    console.log('Response from GAS:', result);
    
    // Tampilkan hasil di frontend
    displayResult(result.html || result.message);
    
  } catch (error) {
    console.error('Error executing command:', error);
    
    let errorMessage = 'Terjadi kesalahan: ';
    if (error.name === 'AbortError') {
      errorMessage += 'Timeout - Server terlalu lama merespon';
    } else {
      errorMessage += error.message;
    }
    
    displayError(errorMessage);
    
  } finally {
    hideLoading(loadingId);
  }
}

function createOutputDiv() {

    div.className = 'command-output';
    document.querySelector('.container').appendChild(div);
  }
  return div;
}

function showLoading(id, message) {
  const loadingDiv = document.createElement('div');
  loadingDiv.id = id;
  loadingDiv.className = 'loading-overlay';
  loadingDiv.innerHTML = `
    <div class="loading-spinner"></div>
    <div class="loading-text">${message}</div>
  `;
  document.body.appendChild(loadingDiv);
}

function hideLoading(id) {
  const loadingDiv = document.getElementById(id);
  if (loadingDiv) {
    loadingDiv.remove();
  }
}

  // Jika di Telegram Mini App
  if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) {
    return window.Telegram.WebApp.initDataUnsafe.user.id;
  }

    userId = 'user_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('user_id', userId);
  }
  return userId;
}

    // ============================================================================
    // MAIN COMMAND EXECUTION

    async function executeCommand(command) {
      if (isProcessing) {
        showNotification('Please wait for current process to complete', 'warning');
        return;
      }
      
      // Get user info from Telegram
      const user = tg.initDataUnsafe.user;
      if (!user || !user.id) {
        showNotification('Please open this app through Telegram', 'error');
        return;
      }
      
      // Show loading state
      isProcessing = true;
      showLoading(true);
      hideResults();
      
      // Extract command info
      const commandParts = command.split('-');
      const baseCommand = commandParts[0];
      const stockCode = commandParts[1] || '';
      
      // Update loading text
      elements.loadingText.textContent = `Processing ${baseCommand} ${stockCode ? `for ${stockCode}` : ''}...`;
      
      // Prepare request data
      const requestData = {
        userId: user.id,
        command: command,
        username: user.username || '',
        firstName: user.first_name || '',
        source: 'mini_app',
        returnFormat: 'html' // Request HTML for display
      };
      
      try {
        // Send request to Google Apps Script
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(requestData),
          mode: 'cors'
        });
        
        // Handle response
        if (response.ok) {
          const data = await response.json();
          
          if (data.status === 'success' && data.html) {
            // Display the HTML response
            displayResults(data.html, command, stockCode);
            showNotification(`✅ Analysis completed for ${stockCode || 'command'}`, 'success');
          } else if (data.status === 'success' && data.message) {
            // Fallback to message display
            displayFallbackResults(command, stockCode, data.message);
            showNotification(`✅ Command executed successfully`, 'success');
          } else {
            throw new Error(data.message || 'Invalid response format');
          }
          
        } else {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
      } catch (error) {
        console.error('❌ API Error:', error);
        
        // Fallback to demo data if API fails
        const fallbackHtml = generateFallbackContent(command, stockCode);
        displayResults(fallbackHtml, command, stockCode);
        
        showNotification(
          `⚠️ Using demo data. API error: ${error.message}`, 
          'warning'
        );
      } finally {
        // Reset loading state
        isProcessing = false;
        showLoading(false);
        
        // Clear input
        elements.stockInput.value = '';
        
        // Haptic feedback
        if (tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
          try {
            tg.HapticFeedback.impactOccurred('light');
          } catch (e) {}
        }
      }
    }
