<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Screener Slingshot</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }

    button {
      padding: 8px 14px;
      cursor: pointer;
      margin-right: 10px;
    }

    #loading { display: none; font-weight: bold; }

    input {
      padding: 6px;
      margin-right: 10px;
      width: 200px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    th.sort-asc::after { content: " ▲"; }
    th.sort-desc::after { content: " ▼"; }

    #pagination {
      margin-top: 15px;
    }

    #pagination button {
      margin: 0 3px;
    }
  </style>
</head>
<body>

  <button id="btnScreener">Screener Slingshot</button>
  <input id="filterInput" type="text" placeholder="Filter saham...">

  <div id="loading">⏳ Loading data...</div>

  <table id="resultTable"></table>
  <div id="pagination"></div>

  <script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT0WOo8T_vpgXMdyOgtr2YQQyNSBnB4Xg-l-JhE7M048OcC4WjcwjG-GTXrBi7FkYAGIooL6hvslITF/pub?output=csv";

const btn = document.getElementById("btnScreener");
const loading = document.getElementById("loading");
const table = document.getElementById("resultTable");
const paginationDiv = document.getElementById("pagination");
const filterInput = document.getElementById("filterInput");

let rawData = [];
let filteredData = [];
let currentPage = 1;
let rowsPerPage = 10;
let sortColumn = null;
let sortDirection = "asc";

btn.addEventListener("click", loadCSV);
filterInput.addEventListener("input", applyFilter);

async function loadCSV() {
  loading.style.display = "block";
  table.innerHTML = "";
  paginationDiv.innerHTML = "";

  try {
    const response = await fetch(CSV_URL);
    const csvText = await response.text();

    rawData = csvText.trim().split("\n").map(r => r.split(","));
    filteredData = [...rawData];

    currentPage = 1;
    render();
  } catch (err) {
    alert("Gagal mengambil data CSV");
    console.error(err);
  } finally {
    loading.style.display = "none";
  }
}

function applyFilter() {
  const keyword = filterInput.value.toLowerCase();

  filteredData = [
    rawData[0],
    ...rawData.slice(1).filter(row =>
      row.join(" ").toLowerCase().includes(keyword)
    )
  ];

  currentPage = 1;
  render();
}

function render() {
  renderTable();
  renderPagination();
}

function renderTable() {
  table.innerHTML = "";

  if (filteredData.length === 0) {
    table.innerHTML = "<tr><td colspan='100%'>Tidak ada data</td></tr>";
    return;
  }

  // HEADER
  const header = filteredData[0];
  let thead = "<tr>";

  header.forEach((col, idx) => {
    let cls = "";
    if (sortColumn === idx) {
      cls = sortDirection === "asc" ? "sort-asc" : "sort-desc";
    }
    thead += `<th class="${cls}" onclick="sortTable(${idx})">${col}</th>`;
  });

  thead += "</tr>";
  table.innerHTML += thead;

  // BODY
  const start = (currentPage - 1) * rowsPerPage + 1;
  const end = start + rowsPerPage;
  const rows = filteredData.slice(start, end);

  rows.forEach(row => {
    let tr = "<tr>";
    row.forEach(col => tr += `<td>${col}</td>`);
    tr += "</tr>";
    table.innerHTML += tr;
  });
}

function renderPagination() {
  paginationDiv.innerHTML = "";

  const totalPages = Math.ceil((filteredData.length - 1) / rowsPerPage);

  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;
    btn.disabled = i === currentPage;
    btn.onclick = () => {
      currentPage = i;
      renderTable();
    };
    paginationDiv.appendChild(btn);
  }
}

window.sortTable = function (columnIndex) {
  if (sortColumn === columnIndex) {
    sortDirection = sortDirection === "asc" ? "desc" : "asc";
  } else {
    sortColumn = columnIndex;
    sortDirection = "asc";
  }

  const header = filteredData[0];
  const body = filteredData.slice(1);

  body.sort((a, b) => {
    const valA = a[columnIndex]?.trim();
    const valB = b[columnIndex]?.trim();

    if (!isNaN(valA) && !isNaN(valB)) {
      return sortDirection === "asc"
        ? valA - valB
        : valB - valA;
    }

    return sortDirection === "asc"
      ? valA.localeCompare(valB)
      : valB.localeCompare(valA);
  });

  filteredData = [header, ...body];
  renderTable();
};
</script>
</body>
</html>
